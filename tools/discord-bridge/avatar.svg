<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img"
  aria-labelledby="title desc">
  <title id="title">Vanta bot</title>
  <desc
    id="desc">The obsidian silver Vanta mark with mismatched googly eyes so bot messages read distinctly from the application icon.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#202124" />
      <stop offset=".55" stop-color="#0c0d0f" />
      <stop offset="1" stop-color="#050506" />
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafafa" />
      <stop offset="1" stop-color="#9a9ca2" />
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b6b8bf" />
      <stop offset="1" stop-color="#55575e" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#tile)" stroke="#404146"
    stroke-width="2" />
  <path d="M124 150h73l86 190-34 37z" fill="url(#left)" />
  <path d="M315 150h73L283 377h-34z" fill="url(#right)" />
  <path d="m315 150-66 227 34-37z" fill="#e2e3e7" opacity=".32" />
  <!--
    The bot avatar: the Vanta mark with googly eyes stuck on. It has to be
    distinguishable from the app icon at 32px in a member list, or a bot
    message reads as the application talking. Mismatched eye sizes with pupils
    looking slightly askew keep it unmistakably a bot avatar.
  -->
  <g>
    <circle cx="204" cy="184" r="42" fill="#ffffff" stroke="#141414" stroke-width="6" />
    <circle cx="216" cy="197" r="17" fill="#111111" />
    <circle cx="308" cy="176" r="36" fill="#ffffff" stroke="#141414" stroke-width="6" />
    <circle cx="299" cy="189" r="15" fill="#111111" />
  </g>
</svg>
