<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Vanta - Open-Source Native Roblox on Linux</title>
  <desc id="desc">Vanta obsidian silver V emblem with feature highlights and one-line Linux installer command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="55%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="44%" r="44%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#9ca3af" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#a1a8b8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22242a"/>
      <stop offset="55%" stop-color="#0e0f13"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="vLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9da0a8"/>
    </linearGradient>
    <linearGradient id="vRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcbec6"/>
      <stop offset="100%" stop-color="#555760"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c808c"/>
      <stop offset="100%" stop-color="#7c808c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Subtle outer frame -->
  <rect x="24" y="24" width="1232" height="592" rx="28" fill="none" stroke="#262930" stroke-width="1.5"/>

  <!-- Official Vanta Mark (scaled & centered left) -->
  <g transform="translate(88 122) scale(0.56)">
    <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#tile)" stroke="#444750" stroke-width="3"/>
    <path d="M124 150h73l86 190-34 37z" fill="url(#vLeft)"/>
    <path d="M315 150h73L283 377h-34z" fill="url(#vRight)"/>
    <path d="m315 150-66 227 34-37z" fill="#e4e6ec" opacity=".32"/>
  </g>

  <!-- Wordmark + Open Source pill -->
  <text x="412" y="206" fill="#fafafa" font-family="Adwaita Sans, Noto Sans, DejaVu Sans, sans-serif" font-size="88" font-weight="700" letter-spacing="14">VANTA</text>

  <g transform="translate(866 150)">
    <rect width="194" height="42" rx="21" fill="#16181e" stroke="#343844" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#4ade80"/>
    <text x="40" y="27" fill="#d4d7df" font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="16" font-weight="600" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <!-- Divider rule -->
  <rect x="414" y="232" width="220" height="2.5" rx="1.25" fill="url(#divider)"/>

  <!-- Headline & subcopy -->
  <text x="412" y="294" fill="#e8eaef" font-family="Adwaita Sans, Noto Sans, DejaVu Sans, sans-serif" font-size="38" font-weight="600">Roblox, natively on Linux.</text>
  <text x="412" y="340" fill="#9ea3b0" font-family="Adwaita Sans, Noto Sans, DejaVu Sans, sans-serif" font-size="23" font-weight="400">No emulator or VM. Runs on x86-64 and ARM64 Linux.</text>

  <!-- Feature pills row -->
  <g font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="17" font-weight="500">
    <g transform="translate(412 376)">
      <rect width="166" height="40" rx="10" fill="#14161c" stroke="#2d313b" stroke-width="1.2"/>
      <text x="83" y="26" text-anchor="middle" fill="#d9dce4">Live Perf HUD</text>
    </g>
    <g transform="translate(592 376)">
      <rect width="150" height="40" rx="10" fill="#14161c" stroke="#2d313b" stroke-width="1.2"/>
      <text x="75" y="26" text-anchor="middle" fill="#d9dce4">Asset Mods</text>
    </g>
    <g transform="translate(756 376)">
      <rect width="196" height="40" rx="10" fill="#14161c" stroke="#2d313b" stroke-width="1.2"/>
      <text x="98" y="26" text-anchor="middle" fill="#d9dce4">Wayland, Niri &amp; VR</text>
    </g>
    <g transform="translate(966 376)">
      <rect width="190" height="40" rx="10" fill="#14161c" stroke="#2d313b" stroke-width="1.2"/>
      <text x="95" y="26" text-anchor="middle" fill="#d9dce4">x86-64 &amp; ARM64</text>
    </g>
  </g>

  <!-- Bottom terminal install bar -->
  <g transform="translate(110 492)">
    <rect width="1060" height="66" rx="14" fill="#0d0e12" stroke="#2b2f39" stroke-width="1.5"/>
    <text x="28" y="40" fill="#6b7280" font-family="JetBrainsMono NF, Adwaita Mono, monospace" font-size="21" font-weight="600">$</text>
    <text x="56" y="40" fill="#e5e7eb" font-family="JetBrainsMono NF, Adwaita Mono, monospace" font-size="21" font-weight="400">curl -fsSL https://gpt4omni.github.io/vanta/install.sh | bash</text>
    <text x="1032" y="39" text-anchor="end" fill="#8b92a2" font-family="Adwaita Sans, Noto Sans, sans-serif" font-size="15" font-weight="500">GPL-3.0</text>
  </g>
</svg>
